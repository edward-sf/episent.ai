name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Supabase contract tests skip themselves without SUPABASE_TEST_* env vars.
      - name: Test
        run: npm test

      - name: Bundle API Worker
        run: npx wrangler deploy --dry-run -c wrangler.api.jsonc --outdir dist/api

      - name: Bundle aggregator Worker
        run: npx wrangler deploy --dry-run -c wrangler.cron.jsonc --outdir dist/cron
